packages:
  - "apps/*"
  - "packages/*"
  - "ee/*"
  - "infra"

catalog:
  remotion: 4.0.496
  "@remotion/cli": 4.0.496
  "@remotion/bundler": 4.0.496
  "@remotion/renderer": 4.0.496
  "@remotion/google-fonts": 4.0.496
  "@remotion/tailwind-v4": 4.0.496
  react: 19.2.7
  react-dom: 19.2.7

# pnpm 10 reads build-script allowlists here (moved out of package.json's "pnpm" field).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# Security overrides: pin patched transitive versions to clear Dependabot alerts.
# pnpm 10 reads `overrides` from here (same as the settings above), not package.json.
#   esbuild 0.28.1 -> fixes GHSA-gv7w-rqvm-qjhr (#8, high) + GHSA-g7r4-m6w7-qqqr (#7, low);
#     within vite 8's supported "^0.27.0 || ^0.28.0", no build-API breaking changes for our targets.
#   postcss 8.5.15 -> fixes CVE-2026-41305 / GHSA-qx2v-qp2m-jg93 (#1, medium); >= 8.5.10,
#     dedupes with vite's existing 8.5.15 and satisfies @tailwindcss/postcss's ^8.5.10.
# The range-scoped pins below were stranded in package.json's "pnpm.overrides" (pnpm 10 stopped
# reading that field, silently making them inert). Moved here so they apply again. Range-scoped
# (`name@<fixed`) so only the vulnerable versions are bumped:
#   form-data >=4.0.6 (critical + high), undici >=7.28.0 (high/med/low), tmp >=0.2.6,
#   uuid >=11.1.1, js-yaml >=4.3.0.
#
# CAUTION on the `name@<fixed` form: the key stops matching the moment an advisory moves its fix floor
# ABOVE `fixed`, and pnpm reports nothing — the pin just goes silently inert. That is exactly how the
# js-yaml alert below came to be open (the key said `<4.2.0` while the tree sat at 4.2.0). When a new
# advisory lands on an already-pinned package, RETARGET the key; do not assume the old pin still covers.
#
#   js-yaml >=4.3.0 -> fixes GHSA-52cp-r559-cp3m / CVE-2026-59869 (#24, high; quadratic CPU via YAML
#     merge-key chains). RETARGETED from the now-inert `<4.2.0` key. Dev-only in this tree
#     (apps/www -> @lhci/cli -> @lhci/utils, and packages/sdk-ts -> openapi-typescript ->
#     @redocly/openapi-core); nothing first-party imports js-yaml. 4.3.0 is API-identical to 4.2.0
#     (index.js byte-identical; only the loader/int/float internals changed).
#     NB @lhci/utils declares js-yaml ^3.13.1 and calls the v4-removed `yaml.safeLoad()`; this pin has
#     been carrying it across the 3->4 major since #124. Harmless today ONLY because that call sits
#     behind a .yaml/.yml extension check and the repo's lhci config is apps/www/lighthouserc.json —
#     so do not add a lighthouserc.yaml without revisiting this pin.
#   brace-expansion >=1.1.16 -> fixes GHSA-3jxr-9vmj-r5cp / CVE-2026-13149 (#23, high; exponential-time
#     expansion of consecutive `{}` groups). Only the 1.x band is vulnerable here — the tree's 2.1.2 and
#     5.0.7 are already at/above their own fix floors, and the `<1.1.16` key deliberately leaves them
#     alone (a wider key would drag minimatch@3 across a major). 1.1.16 satisfies its parent's ^1.1.7.
#   body-parser >=1.20.6 -> fixes GHSA-v422-hmwv-36x6 / CVE-2026-12590 (#25, low; an invalid `limit`
#     silently disables size enforcement). Only the 1.x band: express@5's body-parser@2.3.0 is already
#     patched and the key does not match it. 1.20.6 satisfies express@4's declared ~1.20.5.
#
# The three pins below clear five alerts, all on transitives of ONE direct dependency —
# apps/mcp's `@modelcontextprotocol/sdk@1.29.0`, which is already the newest published release, so
# there is no parent bump to take instead. Reachability was measured against the real deployed
# artifact (`wrangler deploy -c apps/mcp/wrangler.jsonc --dry-run`, 2,673,185 bytes), not inferred
# from node_modules — only fast-uri is actually in it.
#   fast-uri >=3.1.3 -> fixes GHSA-4c8g-83qw-93j6 (#30, high; the IDN path calls the non-existent
#     `URL.domainToASCII`, swallows the resulting TypeError into `parsed.error`, and hands back a
#     host still in Unicode — a check/use desync for anything gating on that host). The ONLY one of
#     the five that ships: ajv is statically imported by the SDK's server/index.js and `require`s
#     fast-uri at isolate init, putting 3 fast-uri modules in the Worker bundle. ajv@8.20.0 declares
#     `fast-uri ^3.0.1`, so ^3.1.3 is an in-range patch bump. Reached only as ajv's `uriResolver`
#     for schema `$id`/`$ref` (ajv-formats 3.0.1 implements `format: "uri"` as a regex and never
#     calls it), and the outbound-delivery URL path does not touch ajv at all — so the HIGH rating
#     does not carry over to this tree. NB @redocly/cli esbuild-INLINES its own copy of fast-uri
#     3.1.2, which the lockfile records as a zero-dep leaf; no override can reach those bytes. That
#     copy is dev-only (`pnpm --filter @webhook-co/openapi validate`) and never deployed.
#   hono >=4.12.27 -> fixes GHSA-hvrm-45r6-mjfj (#29, med; hono/jsx leaks context across requests),
#     GHSA-w62v-xxxg-mg59 (#28, med; JSX escaping bypass in cx()) and GHSA-xgm2-5f3f-mvvc (#27, med;
#     the API Gateway v1 adapter drops a repeated header). None are reachable: hono is 0 of 521
#     inputs in the deployed bundle, nothing in the tree imports hono/jsx, hono/css or
#     hono/aws-lambda, and no tsconfig sets jsxImportSource. 4.12.27 satisfies the SDK's declared
#     ^4.11.4 — an in-range minor, so this is a free hygiene pin.
#   @hono/node-server >=2.0.5 -> fixes GHSA-frvp-7c67-39w9 (#26, med; serve-static path traversal on
#     WINDOWS via an encoded backslash). This pin deliberately CROSSES A MAJOR and violates the
#     SDK's declared `^1.19.9`: 1.19.14 is the last 1.x ever published and the fix floor is 2.0.5,
#     so no in-range option exists. Safe on three independent counts — the SDK consumes exactly one
#     symbol from the root entry (`getRequestListener`, dist/esm/server/streamableHttp.js), whose
#     declaration is byte-identical in 1.19.14 and 2.x; v2's only breaking changes are `engines
#     node >=20` (we require >=24) and dropping the ./vercel subpath (zero references here); and the
#     package is absent from the Worker bundle entirely, because `agents` routes MCP through
#     server/webStandardStreamableHttp.js and never touches the Node transport. Retarget to a 1.x
#     key if upstream ever widens its range (modelcontextprotocol/typescript-sdk#2531).
#
# sharp >=0.35.0 -> fixes GHSA-f88m-g3jw-g9cj (#31, high; four libvips CVEs — CVE-2026-33327/33328/
#   35590/35591 — in the GIF, TIFF and VIPS decoders). 0.35.3 carries libvips 8.18.3. The tree held
#   TWO copies: apps/www already declared ^0.35.3 for its brand-mail asset script, while `next` (an
#   OPTIONAL dep, `^0.34.5`) and `miniflare` (an EXACT `0.34.5`) each dragged in a vulnerable 0.34.5.
#   This key deliberately crosses both of those declared ranges, which is safe here because nothing
#   loads either copy: there is no Cloudflare Images binding anywhere in the repo (miniflare's only
#   sharp consumer), and apps/www builds with `output: "export"` + `images: { unoptimized: true }`,
#   so Next's image optimizer — the only thing that would `require` its optional sharp — never runs.
#   The one place sharp is genuinely called (apps/www/scripts/gen-brand-mail-assets.mjs and the
#   apple-branded-mail drift test) was ALREADY on 0.35.3, so this version is proven in this tree
#   rather than assumed. The advisory's precondition is "processing untrusted input"; these paths
#   process our own committed brand assets. Collapsing to one copy also removes a second native
#   binary from every install. Drop this key once next and miniflare both ship a >=0.35 default.
overrides:
  esbuild: 0.28.1
  postcss: 8.5.15
  "tmp@<0.2.6": "^0.2.6"
  "uuid@<11.1.1": "^11.1.1"
  "js-yaml@<4.3.0": "^4.3.0"
  "form-data@<4.0.6": "^4.0.6"
  "undici@<7.28.0": "^7.28.0"
  "brace-expansion@<1.1.16": "^1.1.16"
  "body-parser@<1.20.6": "^1.20.6"
  "fast-uri@<3.1.3": "^3.1.3"
  "hono@<4.12.27": "^4.12.27"
  "@hono/node-server@<2.0.5": "^2.0.5"
  "sharp@<0.35.0": "^0.35.0"
