# Release the Python SDK (webhook-co) to PyPI. Triggered by an `sdk-python-vX.Y.Z` tag (or a manual
# dispatch for testing). Builds + tests, then publishes with `twine` using the `PYPI_TOKEN` repo secret
# (a PyPI API token, username `__token__`). No marketplace action is used — `twine` is a plain CLI, so the
# org's GitHub-owned-Actions-only policy is honoured. (The earlier design used PyPI's OIDC trusted-publisher
# mint-token flow, but the founder provided an API token instead of configuring a Trusted Publisher.)
name: release-sdk-python

on:
  push:
    tags: ["sdk-python-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (a dispatch never publishes)"
        required: true

permissions:
  contents: read # token-based publish; no OIDC id-token needed

concurrency:
  group: release-sdk-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release webhook-co (PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # User-controlled values (the dispatch input) flow through env, never `${{ }}`-interpolated into the
      # script — a shell-injection guard. EVENT_NAME is a trusted GitHub context.
      - name: Resolve version from the trigger
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${REF_NAME#sdk-python-v}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::not a valid version: '$VERSION' (expected X.Y.Z)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install + test (incl. the generated-models drift guard)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
          black --check src tests scripts
          isort --check-only src tests scripts
          pytest -q

      - name: Stamp the release version + build sdist/wheel
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["VERSION"]
          p = pathlib.Path("pyproject.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', t, count=1)
          p.write_text(t)
          PY
          python -m build

      - name: Verify the built version matches the tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ls "dist/webhook_co-${VERSION}-py3-none-any.whl" "dist/webhook_co-${VERSION}.tar.gz" \
            || { echo "::error::built artifacts don't match version $VERSION"; exit 1; }

      # Publish only on a real tag PUSH (never a dispatch). Uses the PYPI_TOKEN repo secret; the token is
      # passed via env (never `${{ }}`-interpolated into the script) and twine reads it from the environment.
      - name: Publish to PyPI
        if: github.event_name == 'push'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_TOKEN secret is not set — cannot publish. Add it in repo settings."
            exit 1
          fi
          twine upload --non-interactive dist/*
          echo "Published webhook-co ${{ steps.ver.outputs.version }} to PyPI."
