name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# These job names are the REQUIRED status checks referenced by the `main` branch ruleset.
# If you rename a job here, update the ruleset (see .github/ or repo settings) to match.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  go-sdk-spec-sync:
    name: webhook-go vendored spec is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Go SDK lives in a separate repo, so its route-coverage ratchet validates against a VENDORED copy
      # of this spec (webhook-go testdata/openapi.json). A derived artifact whose guard is not triggered by
      # its SOURCE rots silently — exactly how the Python SDK's generated models fell 12 schemas behind
      # while CI stayed green (the ci-sdk-python paths filter excluded this very file). A stale vendored
      # spec would disarm the Go ratchet the same way: it would keep passing against an old route list, so a
      # newly-shipped route could reach production with no Go method and nothing would say a word.
      #
      # If this fails: copy packages/openapi/src/openapi.json into webhook-go/testdata/ and open a PR there.
      - name: Compare the live spec against webhook-go's vendored copy
        run: |
          curl -fsSL -o /tmp/vendored-openapi.json \
            https://raw.githubusercontent.com/webhook-co/webhook-go/main/testdata/openapi.json
          if ! diff -q packages/openapi/src/openapi.json /tmp/vendored-openapi.json > /dev/null; then
            echo "::error::webhook-go's testdata/openapi.json is STALE — its route-coverage ratchet is"
            echo "::error::validating against an old spec, so a new route can ship with no Go SDK method."
            echo "::error::Fix: copy packages/openapi/src/openapi.json to webhook-go/testdata/ and open a PR."
            diff packages/openapi/src/openapi.json /tmp/vendored-openapi.json || true
            exit 1
          fi
          echo "webhook-go's vendored spec matches the live spec."

  sdk-packaged-smoke:
    name: sdk packaged-artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The unit suite imports from src/. That proves the CODE works and NOTHING about what users install:
      # a broken `exports` map, a file missing from `files:`, or a bad `types` path all ship green because no
      # test ever touches the tarball. This packs the real artifact, installs it into a scratch dir, imports
      # it through its own exports map, and drives it against a stub. Verified to catch a broken exports map.
      - run: pnpm --filter @webhook-co/sdk build
      - run: node scripts/sdk-packaged-smoke.mjs

  webhooks-spec-packaged-smoke:
    name: webhooks-spec packaged-artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Same reasoning as the SDK above, plus one this package has already been bitten by: its `dist/` was
      # unloadable by Node for its whole private life (tsc emits extensionless relative specifiers), because
      # every workspace consumer imports src/ and nothing ever loaded the build. Running this on PRs — not
      # only at release — is what keeps that from coming back.
      #
      # It also asserts the PACKED manifest points at dist/ rather than at TypeScript source. That rewrite
      # comes from `publishConfig` and is applied by PNPM only; `npm publish` ignores it. If the release
      # path is ever switched to plain npm, this check fails instead of TypeScript reaching the registry.
      - run: pnpm --filter @webhook-co/webhooks-spec build
      - run: node scripts/webhooks-spec-packaged-smoke.mjs

  client-versions-current:
    name: CLIENT_LATEST matches the registries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # CLIENT_LATEST (packages/shared/src/client-advisory.ts) is what the API compares a client's
      # User-Agent against to decide whether to advise an update. It is a DERIVED fact — the truth lives in
      # npm / PyPI / GitHub — so a committed copy ROTS, and a rotted copy makes the advisory a silent no-op
      # (we would tell people on old SDKs that they are current). Guard it from its SOURCE, like the
      # webhook-go spec-sync job.
      - run: node scripts/check-client-versions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli-channels-agree:
    name: npm and Homebrew serve the same CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # `wbhk` ships via npm AND Homebrew, and they can silently diverge: release-cli publishes npm
      # immediately but leaves the GitHub release as a DRAFT (a deliberate human gate), while homebrew-bump
      # only fires on `release: published`. Tagging cli-v0.3.0 therefore shipped npm 0.3.0 and left brew on
      # 0.2.0 — and nothing complained. A brew user ran `wbhk -v`, saw 0.2.0, ran `brew upgrade`, and got
      # 0.2.0 again. The gate stays; forgetting it is now a red check instead of a silent stranding.
      - run: node scripts/check-cli-channels.mjs

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Coverage thresholds are enforced inside the Vitest config (see packages/shared).
      - run: pnpm test

  # The @webhook-co/db package is excluded from `pnpm test` (it needs a real Postgres
  # with real non-owner roles to exercise RLS / FORCE / the ingest function / the audit
  # chain). This job provides that Postgres and runs the schema + RLS + migration-
  # reversibility suite. POSTGRES_HOST_AUTH_METHOD=trust mirrors the local --auth=trust
  # harness so the test roles (webhook_owner/app/ingest) connect without passwords (no
  # secrets in CI); each test file creates its own database on the service for isolation.
  test-db:
    name: test-db
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install dbmate
        env:
          DBMATE_SHA256: dfd4027141b6e4357158099bdfe6c02b286af70f8e49057937744cf80b38ea1c
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      # Drift guard: the checked-in Better Auth schema must match what the installed
      # plugins actually generate. The generator reads apps/auth/src/auth.ts (which
      # imports the installed better-auth + @better-auth/api-key) and emits the full
      # schema against an empty DB; we diff that against the source-of-truth file that
      # migration 0001 is derived from. The CLI runs ephemerally via `pnpm dlx` — it is
      # deliberately NOT a tracked dep (it hard-pins an older better-auth); see
      # apps/auth/package.json. Catches both api-key plugin drift and any new core
      # identity columns a better-auth upgrade introduces.
      - name: Better Auth schema drift guard
        run: |
          psql "postgres://postgres@localhost:5432/postgres" -c 'create database auth_schema_check'
          ( cd apps/auth && DATABASE_URL="postgres://postgres@localhost:5432/auth_schema_check" \
            pnpm dlx @better-auth/cli@latest generate --config src/auth.ts --yes \
            --output "$RUNNER_TEMP/better-auth.schema.sql" )
          diff -u packages/db/db/migrations/.better-auth.schema.sql "$RUNNER_TEMP/better-auth.schema.sql"
      - run: pnpm test:db

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Builds the standalone `wbhk` CLI binary with `bun build --compile` and proves shell completion
  # works from THAT binary — the one integration the static gate (vitest/tsc) can't cover, since the
  # completion hook + the bundle's source-resolution only exist in the compiled artifact. bun is
  # installed via the official script (a run step, not a 3rd-party marketplace action) and pinned.
  # `node scripts/bundle.mjs` moves the typecheck-only tsconfig aside so bun resolves the workspace
  # deps to source (see that script). Not yet a required check — add it to the `main` ruleset to gate.
  completion-smoke:
    name: completion-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Version-pinned, NOT SHA-pinned (unlike the dbmate install above): bun's official installer
      # fetches the version-tagged release, and we don't carry a per-platform archive hash. Deliberate
      # delta — this job is CI-only, references no secrets (contents: read), and the binary it builds is
      # a smoke artifact that is never shipped to users, so the blast radius is build-time only.
      - name: Install bun (version-pinned)
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Build the standalone wbhk binary
        run: |
          rm -f packages/cli/dist/wbhk   # never assert against a stale artifact from a reused workspace
          pnpm --filter @webhook-co/cli run bundle
      - name: Completion hook fires from the compiled binary
        run: |
          BIN=packages/cli/dist/wbhk
          test -x "$BIN"
          # The emitted bash script registers the completion function…
          "$BIN" completion bash | grep -q "complete -F _wbhk_complete wbhk"
          # …and the hidden engine returns live proposals (filtered to the partial).
          "$BIN" __complete -- ev | grep -qx "events"
          "$BIN" __complete -- events "" | grep -qx "list"
          "$BIN" __complete -- whoami -- | grep -q -- "--output"
          echo "completion hook OK (compiled binary)"
      # The zsh/fish scripts are hand-authored (D4b) — a syntax typo would break a user's shell. Parse-only
      # check them with the real shells (the interactive tab behavior is a human eyeball; this gates syntax).
      - name: Install zsh + fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: zsh + fish completion scripts parse
        run: |
          BIN=packages/cli/dist/wbhk
          "$BIN" completion zsh > /tmp/wbhk.zsh && zsh -n /tmp/wbhk.zsh && echo "zsh -n OK"
          "$BIN" completion fish > /tmp/wbhk.fish && fish --no-execute /tmp/wbhk.fish && echo "fish parse OK"
      - name: zsh tokenization guard (the (@) slice must pass SEPARATE words to __complete)
        run: |
          # Drive _wbhk with a stub `wbhk` that records its argc. `wbhk events <TAB>` (words=(wbhk events ''),
          # CURRENT=3) must call `wbhk __complete -- events <empty>` = 4 args. The earlier bug joined the
          # slice into one word (3 args), silently killing all subcommand/flag completion — guard it.
          cat > /tmp/zcheck.zsh <<'ZEOF'
          emulate -L zsh
          wbhk() { print -r -- "$#" > /tmp/argc.txt }
          compadd() { : }; compdef() { : }
          source /tmp/wbhk.zsh
          words=(wbhk events ''); CURRENT=3
          _wbhk
          ZEOF
          zsh /tmp/zcheck.zsh
          test "$(cat /tmp/argc.txt)" = "4" && echo "zsh tokenization OK (separate words preserved)"

  # Bundle apps/auth for Cloudflare Workers and validate the full deploy shape. The `build` job's
  # `next build` does NOT cover the worker bundle, where workerd-only resolution issues surface (e.g.
  # pg-cloudflare, @better-auth/core's workerd `instrumentation` entry). `deploy:dry` runs the OpenNext
  # workerd build AND `wrangler deploy --dry-run`, which bundles Lane C's src/worker.ts entry (the
  # OAuthProvider wrapping the OpenNext handler — A2b-1) — so the OAuth-issuer mount is gated here too.
  # The turbo step builds the workspace deps' dist (the tsconfig-paths redirect targets) first.
  build-cf:
    name: build-cf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build --filter=@webhook-co/auth
      - run: pnpm -C apps/auth deploy:dry

  # Builds the static marketing export and asserts the emitted out/index.html <head> against the
  # SEO rule set (canonical/OG/twitter/robots/JSON-LD/lang present and consistent; anchor targets
  # resolve). Structural problems fail the build; authoring guidelines (title/description length)
  # are warnings. Add this job to the `main` ruleset's required checks to make it blocking.
  seo-html-check:
    name: seo-html-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Unit-test the pure gate helpers (dead-link regex, SEO head rules, sitemap parsing) against
      # fixtures BEFORE the build — a fast fail if the gate logic itself regressed. These node:test
      # files previously existed but were wired into no CI job, so they could rot unnoticed.
      - run: pnpm --filter @webhook-co/www test:scripts
      - run: pnpm --filter @webhook-co/www build
      - run: pnpm --filter @webhook-co/www test:seo
      # Legal section anchors are pasted into signed agreements and vendor questionnaires. This
      # asserts every published anchor actually rendered into out/, that no page has a duplicate id,
      # and that no fragment link — including cross-page ones like /dpa#sub-processors — is an orphan.
      - run: pnpm --filter @webhook-co/www test:anchors
      # The site ships no link to nowhere. `href="#"` was 40-strong standing tech debt; it's now zero,
      # and a dead link is worse than a missing one — it's a tab stop that announces as a link and,
      # with smooth scrolling on, yanks the reader back to the top of the page.
      - run: pnpm --filter @webhook-co/www test:links
      # No indexable page is an ORPHAN. Sixteen /test/<slug> tutorials shipped reachable only from a
      # search result or a typed URL — sitemapped, SEO-checked, axe-scanned and export-verified, four
      # green gates, none of which can tell you whether a human can GET there. This reads the emitted
      # link graph and fails when a sitemapped route has no inbound link from another page.
      - run: pnpm --filter @webhook-co/www test:orphans

  # The DASHBOARD's end-to-end gate: a real Chromium, against a real `next dev`, against a real Postgres
  # (the app connecting as the non-superuser `webhook_app` role, so RLS is actually enforced — the superuser
  # bypasses every policy, and a suite booted as it would go green while proving nothing).
  #
  # This exists because the layers below it are structurally blind to a whole class of bug. The page unit
  # tests MOCK the auth gate, so they keep passing when a page reads the acting org from the wrong place —
  # that is not hypothetical, it is exactly how the dashboard's entire read surface came to be gated on
  # identity alone (verifySession) rather than membership, serving a removed member their ex-org's endpoints,
  # events and webhook payloads for the remaining 7-day life of their stateless cookie. And the server-action
  # tests assert `revalidatePath` was called with a path STRING, so they keep passing when that path no longer
  # exists and the invalidation has silently become a no-op.
  #
  # Postgres service + pinned dbmate, exactly as `test-db` does it: trust auth so the harness's roles connect
  # without secrets, and the suite provisions its own database on the service.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: install
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install dbmate
        env:
          DBMATE_SHA256: dfd4027141b6e4357158099bdfe6c02b286af70f8e49057937744cf80b38ea1c
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      - run: pnpm --filter @webhook-co/web exec playwright install --with-deps chromium
      - run: pnpm --filter @webhook-co/web test:e2e
      # `trace: "retain-on-failure"` (apps/web/playwright.config.ts) writes a full trace — DOM snapshots,
      # console, network — for every failed test. Without this step that trace dies with the runner, so a
      # failure that does NOT reproduce locally is undiagnosable: all you get is the assertion text.
      #
      # That is not hypothetical. `org-events.spec.ts:115` went red on ~4% of runs and never once locally,
      # and the trace is what finally diagnosed it: the RSC payload named `(app)/[...legacy]/page.tsx` as the
      # page that rendered, so the request had never reached the event-detail route at all — `next dev` had
      # not yet learned that route and the catch-all claimed its URL. ("The client never rendered" was the
      # earlier reading of the same symptom, and it was wrong; the client rendered the app's own 404.) The
      # harness now refuses to start until that route resolves (playwright/global-setup.ts).
      # `if: failure()` so a green run uploads nothing.
      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-trace
          path: apps/web/test-results/
          retention-days: 14
          # A failure BEFORE Playwright runs (dbmate, install) leaves no test-results/ at all; that is a
          # legitimately empty upload, not a second failure to report on top of the real one.
          if-no-files-found: ignore

  # Real-browser gate for the AUTH surface — specifically /login, the single door into the product
  # (the issuer bounces unauthenticated /authorize here, and app.'s session handoff bounces here).
  #
  # Until this job existed nothing in CI had ever opened that page in a browser: the jsdom suite injects
  # a fake captcha through a prop so Cloudflare's script never loads, and build-cf only compiles. It found
  # a real bug on its first run — the auth app had no dev/production CSP split, so `next dev` refused
  # eval and the dev client runtime never booted.
  #
  # Unlike web-e2e this needs NO Postgres and no dbmate: a signed-out /login render touches neither
  # secrets nor the database (resolve-signed-in.ts short-circuits on the absent session cookie, and
  # social-providers.ts fails safe). It runs against a PRODUCTION build — see playwright.config.ts for
  # why that is load-bearing rather than incidental.
  #
  # Add to the `main` ruleset's required checks to make it blocking.
  auth-e2e:
    name: auth-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Workspace dependencies only (`^...`). Without their dist/, the app's tsconfig `paths` redirect
      # falls back to package SOURCE and `next build` typechecks packages/shared under this app's DOM
      # lib, which fails on unrelated BufferSource variance. The app's own build happens in the
      # Playwright webServer command so the served build can never be stale.
      - name: Build workspace dependencies
        run: pnpm exec turbo run build --filter='@webhook-co/auth^...'
      # The login page decides which social buttons to render from what is CONFIGURED, reading the
      # Worker env through OpenNext. With no .dev.vars it renders NEITHER button — verified, not assumed
      # — so without this the production-shape assertion would fail in CI and pass locally. These are
      # placeholders: `configuredSocialProviders` tests PRESENCE and never the value, and no request
      # leaves the box. Not a secret, and never a real credential.
      - name: Write placeholder OAuth config
        run: |
          cat > apps/auth/.dev.vars <<'VARS'
          GOOGLE_CLIENT_ID=e2e-placeholder-client-id
          GOOGLE_CLIENT_SECRET=e2e-placeholder-client-secret
          GITHUB_CLIENT_ID=e2e-placeholder-client-id
          GITHUB_CLIENT_SECRET=e2e-placeholder-client-secret
          VARS
      - run: pnpm --filter @webhook-co/auth exec playwright install --with-deps chromium
      - run: pnpm --filter @webhook-co/auth test:e2e
      # `trace: "retain-on-failure"` writes DOM snapshots, console and network for every failed test.
      # Without this the trace dies with the runner and a failure that does not reproduce locally is
      # undiagnosable — the CSP assertions in particular are near-impossible to debug from assertion
      # text alone, which is why the spec also records each violation's source file.
      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-e2e-trace
          path: apps/auth/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Real-browser accessibility gate: builds the static export, serves it, and runs axe-core in
  # Chromium across the homepage's interactive states AND the five legal pages. This is the only
  # layer that sees real layout, so the only one that catches color contrast and target size. Add to
  # the `main` ruleset's required checks to make it blocking.
  a11y-e2e:
    name: a11y-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @webhook-co/www build
      - run: pnpm --filter @webhook-co/www exec playwright install --with-deps chromium
      - run: pnpm --filter @webhook-co/www test:a11y

  # Lighthouse-CI budget gate over the static export. Blocks on the deterministic budgets (SEO
  # category, CLS, total byte weight); perf / LCP / a11y-category are warn-only (lab-variable —
  # the a11y-e2e job above is the hard a11y gate). Uses the Chrome preinstalled on the runner.
  # Add to required checks to make it blocking.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @webhook-co/www build
      - run: pnpm --filter @webhook-co/www test:lighthouse

  no-skipped-tests:
    name: no-skipped-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run no-skipped-tests

  # Enforces the Node<->Workers tsconfig boundary convention: a cross-boundary internal
  # dependency edge must redirect the dep to its built dist *.d.ts, never recompile its source
  # across the lib boundary. Keeps a new package from silently reintroducing the friction.
  tsconfig-boundary:
    name: tsconfig-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run tsconfig-boundary

  # Enforces the app. dashboard's Data-Access-Layer gate (ADR-0023): every bypassable server
  # entry point (route handlers, "use server" actions) must call verifySession() or carry a
  # `// dal-gate-allow:` marker, and the (app) render gate must exist. The dashboard is private —
  # this keeps a new ungated tenant-data path from silently shipping.
  dal-gate-guard:
    name: dal-gate-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run dal-gate-guard

  # Dependency vulnerability audit. CRITICAL advisories are blocking (this is a crypto/auth
  # surface — a known-critical transitive vuln must never auto-merge); HIGH stays advisory so
  # routine transitive advisories don't wedge unrelated PRs (Dependabot opens fix PRs).
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # npm RETIRED the legacy quick-audit endpoint `pnpm audit` posts to
      # (`/-/npm/v1/security/audits` → HTTP 410), so `pnpm audit` fails every run regardless of
      # whether any vulnerability exists. scripts/audit-prod.mjs queries the replacement npm mandates
      # (the bulk advisory endpoint, the same one `npm audit` uses) with only Node built-ins — no
      # third-party Action (the org restricts Actions to GitHub-owned publishers) and no binary.
      # Same semantics as before: prod deps only, critical is blocking, high is advisory.
      - name: Audit (critical — blocking)
        run: node scripts/audit-prod.mjs --level=critical
      - name: Audit (high — advisory)
        run: node scripts/audit-prod.mjs --level=high || true
