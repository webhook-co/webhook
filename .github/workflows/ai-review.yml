name: AI review

# Runs the security + QA review sub-agents against the PR diff, with two providers and
# an automatic fallback: Cursor is tried first, Claude is the fallback.
#
# Provider selection (per run):
#   1. If a `CURSOR_API_KEY` repo secret is set, install the Cursor CLI and run the
#      reviewers on the diff (the historical path).
#   2. If Cursor is not configured OR its step fails, fall back to Claude via
#      anthropics/claude-code-action, provided a Claude credential is present.
#   3. If no provider is configured, the job emits a notice and exits successfully.
#
# Whichever provider runs writes its full review to `ai-review-output.md`, ending with a
# machine-readable final line `VERDICT: BLOCK` or `VERDICT: PASS`. A final gate step
# (parsing via the unit-tested scripts/ai-review-verdict.mjs) then:
#   - posts (or updates) a sticky PR comment with the review, and
#   - FAILS the check when the verdict is BLOCK — so blocking findings are visible on the PR
#     instead of buried in the job log.
# `ai-review` is a required check, so the gate FAILS CLOSED: if a provider was configured but
# no verdict was emitted (timeout, --max-turns cutoff, provider error, malformed output), or
# the PR is from a fork (no reviewer secrets), the check goes red rather than passing without
# a review. It stays green only when no reviewer credential is configured at all (not set up).
#
# Escape hatch: add the `skip-ai-review` label to a PR to override the gate to green (e.g. an
# AI false-positive). `labeled`/`unlabeled` are trigger types so toggling the label re-runs
# the check; when labeled, the providers are skipped entirely (no review cost).
#
# Claude credentials (either works; the OAuth token is checked first):
#   - `CLAUDE_CODE_OAUTH_TOKEN` — mint locally with `claude setup-token` on a Claude
#     Pro or Max subscription (no separate pay-as-you-go API account needed).
#   - `ANTHROPIC_API_KEY` — a pay-as-you-go Claude Console key.
# Add whichever you use in Settings -> Secrets and variables -> Actions.
#
# Headless `cursor-agent` requires `--trust` to skip the interactive workspace-trust
# prompt; without it the CLI exits non-zero in CI.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so toggling the `skip-ai-review` escape label re-runs the
    # check (adding a label doesn't fire `synchronize`).
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: ai-review
    runs-on: ubuntu-latest
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect configured providers
        id: gate
        run: |
          if [ -n "${CURSOR_API_KEY:-}" ]; then
            echo "cursor=true" >> "$GITHUB_OUTPUT"
          else
            echo "cursor=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${CURSOR_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::notice title=AI review pending::No reviewer credential set. Add CURSOR_API_KEY (Cursor) and/or CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (Claude) in repo Settings to enable the security + QA reviewers."
          fi

      - name: Compute PR diff
        if: >
          (steps.gate.outputs.cursor == 'true' || steps.gate.outputs.claude == 'true') &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"

      # --- Provider 1: Cursor (tried first) ---
      - name: Install Cursor CLI
        if: >
          steps.gate.outputs.cursor == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run security + QA reviewers on the diff (Cursor)
        id: cursor
        if: >
          steps.gate.outputs.cursor == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
        # Don't abort the job if Cursor fails — let the Claude fallback take over. The
        # verdict gate step (not this step) decides pass/fail.
        continue-on-error: true
        run: |
          # pipefail so a cursor-agent failure propagates through `tee` (otherwise tee's
          # exit 0 would mask it and the Claude fallback would never trigger).
          set -o pipefail
          cursor-agent --print --trust --output-format text \
            "You are running in CI on a pull request. Review ONLY the changes in pr.diff. \
             Apply the security-reviewer and qa-test-reviewer sub-agents defined in \
             .cursor/agents/. Report blocking issues (injection, XSS, secrets, authz/SSRF, \
             PII in logs, missing/weak tests, skipped tests, lowered coverage) with file:line \
             and a concrete fix. Cite findings by file:line only; NEVER quote secret values, \
             tokens, or credentials in your output. If there are no blocking issues, say so \
             explicitly. End your review with a final line that is EXACTLY 'VERDICT: BLOCK' \
             (if there is any blocking issue) or 'VERDICT: PASS' (if there are none) — nothing \
             after it." \
            < pr.diff | tee ai-review-output.md

      # --- Provider 2: Claude (fallback when Cursor is absent or failed) ---
      - name: Run security + QA reviewers on the diff (Claude fallback)
        if: >
          steps.gate.outputs.claude == 'true' &&
          (steps.gate.outputs.cursor != 'true' || steps.cursor.outcome == 'failure') &&
          !contains(github.event.pull_request.labels.*.name, 'skip-ai-review')
        # Don't fail the check if Claude errors — including hitting the --max-turns cap.
        # A cut-off review writes no verdict line, so the gate step skips it silently.
        continue-on-error: true
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          # OAuth token (Pro/Max subscription) is preferred; the API key also works.
          # Whichever secret is unset resolves to an empty string and is ignored.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are running in CI on a pull request. The full PR diff is in the file
            `pr.diff` at the repo root — review ONLY those changes. Apply the
            security-reviewer and qa-test-reviewer sub-agents defined in `.claude/agents/`.
            Report blocking issues (injection, XSS, secrets, authz/SSRF, PII in logs,
            missing/weak tests, skipped tests, lowered coverage) with file:line and a
            concrete fix. Cite findings by file:line only; NEVER quote secret values,
            tokens, or credentials in your output. If there are no blocking issues, say
            so explicitly.

            Then use the Write tool to write your complete review as Markdown to the file
            `ai-review-output.md` at the repo root. The FINAL line of that file must be
            EXACTLY `VERDICT: BLOCK` if you found any blocking issue, or `VERDICT: PASS`
            if there are none — with nothing after it.
          # Write lets Claude produce ai-review-output.md; the others are read-only helpers.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "Write,Read,Grep,Glob"

      # --- Gate: surface the verdict as a PR comment + pass/fail signal ---
      # Runs even when no provider is configured so a fork PR (which gets no
      # reviewer secrets) can't satisfy the required check without a review.
      - name: Surface AI-review verdict
        id: verdict
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURSOR_CONFIGURED: ${{ steps.gate.outputs.cursor }}
          CLAUDE_CONFIGURED: ${{ steps.gate.outputs.claude }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ai-review') }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const MARKER = '<!-- ai-review -->';

            // Import the single, unit-tested source of the parse logic
            // (scripts/ai-review-verdict.test.mjs), so the gate and its tests never drift.
            const { parseVerdict } = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/ai-review-verdict.mjs')).href
            );

            // Best-effort defense-in-depth: mask well-known token shapes and URL basic-auth
            // creds before echoing the review into a PR comment. The primary control is the
            // prompt (cite file:line, never quote secrets); this is the backstop.
            function redactSecrets(text) {
              return String(text)
                .replace(/\b(?:sk-[A-Za-z0-9-]{16,}|sk_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9+/=]{16,}|whk_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{12,})\b/g, '[redacted-secret]')
                .replace(/([a-z][a-z0-9+.-]*:\/\/)[^\s/:@]+:[^\s/@]+@/gi, '$1[redacted]@');
            }

            let raw = '';
            try {
              raw = fs.readFileSync('ai-review-output.md', 'utf8');
            } catch (e) {
              /* no file — provider errored, was skipped, or wrote nothing */
            }

            const verdict = parseVerdict(raw); // 'BLOCK' | 'PASS' | null
            const providersConfigured =
              process.env.CURSOR_CONFIGURED === 'true' || process.env.CLAUDE_CONFIGURED === 'true';
            const skipped = process.env.SKIP_LABEL === 'true';
            const pr = context.payload.pull_request;
            const isFork = Boolean(pr && pr.head && pr.head.repo && pr.head.repo.fork);
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            async function upsertComment(body) {
              if (!issue_number) return;
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            // Escape hatch: a `skip-ai-review` label overrides the gate to green. Providers
            // are skipped when labeled, so `verdict` is usually null here — report it anyway.
            if (skipped) {
              await upsertComment([
                MARKER,
                '## 🟡 AI review — skipped via `skip-ai-review` label',
                '',
                'The gate was overridden by a label, so this check passes regardless of findings. ' +
                  'Remove the label to re-enforce the AI review.',
              ].join('\n'));
              core.notice('AI review skipped via the skip-ai-review label.');
              return;
            }

            // A completed review: post the findings and pass/fail on the verdict.
            if (verdict === 'BLOCK' || verdict === 'PASS') {
              const emoji = verdict === 'BLOCK' ? '🔴' : '🟢';
              const heading = verdict === 'BLOCK'
                ? '**Blocking issues found.** Resolve them (or re-run once addressed) before merge. ' +
                  'To override, add the `skip-ai-review` label.'
                : 'No blocking issues.';
              await upsertComment([
                MARKER,
                `## ${emoji} AI review — VERDICT: ${verdict}`,
                '',
                heading,
                '',
                '<details><summary>Full review</summary>',
                '',
                redactSecrets(raw.trim()),
                '',
                '</details>',
              ].join('\n'));
              if (verdict === 'BLOCK') {
                core.setFailed('AI review flagged blocking issues — see the PR comment.');
              }
              return;
            }

            // No parseable verdict. Fail closed when a review was expected, so a required
            // check can't pass without one; stay green only when the feature isn't set up.
            if (providersConfigured) {
              await upsertComment([
                MARKER,
                '## 🔴 AI review — did not complete',
                '',
                'A reviewer was configured but produced no `VERDICT: BLOCK|PASS` line — a timeout, ' +
                  '`--max-turns` cutoff, provider error, or malformed output. This required gate ' +
                  'fails closed; re-run the check once a full review completes, or add the ' +
                  '`skip-ai-review` label to override.',
              ].join('\n'));
              core.setFailed('AI review did not complete — required gate fails closed. Re-run once a full review completes.');
              return;
            }

            if (isFork) {
              await upsertComment([
                MARKER,
                '## 🔴 AI review — cannot run on a fork PR',
                '',
                'Reviewer credentials are not shared with fork PRs, so the AI review could not run. ' +
                  'A maintainer must review these changes and re-run from a trusted context, or add ' +
                  'the `skip-ai-review` label to override, before merge.',
              ].join('\n'));
              core.setFailed('AI review cannot run on a fork PR — a maintainer must review from a trusted context.');
              return;
            }

            core.notice('No AI reviewer credential configured — AI review skipped. Add CURSOR_API_KEY and/or CLAUDE_CODE_OAUTH_TOKEN to enable it.');
