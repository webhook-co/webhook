name: deploy-get

# Deploys the get.webhook.co install/download shim Worker (apps/get → `webhook-get`). Mirrors deploy-www:
# org policy blocks third-party Marketplace actions, so this calls wrangler directly via pnpm; only actions/*
# are used, pinned by commit SHA. wrangler is a root devDep, so no extra install.
#
#   push to main  -> deploy production (get.webhook.co)
#   pull_request  -> `wrangler deploy --dry-run` (validates config + the bundle without deploying)
#
# The Worker is content-free — it redirects to the canonical install.sh on GitHub rather than bundling it —
# so an installer edit needs no redeploy. NOT a required status check (lives outside ci.yml).

on:
  push:
    branches: [main]
    paths:
      - "apps/get/**"
      - ".github/workflows/deploy-get.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/get/**"
      - ".github/workflows/deploy-get.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-get-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-get
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same-repo only: fork PRs don't receive secrets, so a deploy/dry-run can't authenticate there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Empty on the pull_request path (dry-run + gen-wrangler need no auth) so a PR run never has the
      # prod deploy token in scope; real secret only on push/dispatch. Enforced by deploy-token-pr-guard.
      CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Deploy production (get.webhook.co)
        if: github.event_name == 'push'
        run: pnpm --filter @webhook-co/get exec wrangler deploy
      - name: Validate deploy (dry-run)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @webhook-co/get exec wrangler deploy --dry-run
