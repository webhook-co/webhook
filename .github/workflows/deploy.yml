name: deploy-wedge

# CD for the wedge Workers (engine -> wbhk.my, api -> api.webhook.co, mcp -> mcp.webhook.co).
# Mirrors deploy-www.yml: third-party Marketplace actions are blocked by org policy, so this calls
# wrangler directly via pnpm (wrangler is a root devDep); only actions/* are used, SHA-pinned.
#
# The committed apps/<app>/wrangler.jsonc are placeholders (no real ids — no-secrets). The generator
# (scripts/gen-wrangler-prod.mjs) reads the resource ids from repo VARIABLES + injects account_id /
# workers_dev:false / routes / secrets_store_secrets, emitting the gitignored wrangler.prod.jsonc that
# the deploy reads. Secret VALUES never enter CI — only the CF token (secret) + the non-secret ids.
#
#   push to main / dispatch from main -> generate, then `wrangler deploy` all three (production)
#   pull_request                   -> generate, then `wrangler deploy --dry-run` (validates config +
#                                     bundle without deploying)
#
# NOT a required status check (lives outside ci.yml); a deploy failure never blocks a merge. Custom
# domains are bound once at the zone (human-reviewed) — a normal deploy only refreshes the Worker.

on:
  push:
    branches: [main]
    paths:
      - "apps/engine/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/**"
      - "scripts/gen-wrangler-prod.mjs"
      - ".github/workflows/deploy.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/engine/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/**"
      - "scripts/gen-wrangler-prod.mjs"
      - ".github/workflows/deploy.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-wedge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-wedge
    runs-on: ubuntu-latest
    # Same-repo only: fork PRs don't receive secrets/vars, so a deploy/dry-run can't authenticate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Empty on the pull_request path (dry-run + gen-wrangler need no auth) so a PR run never has the
      # prod deploy token in scope; real secret only on push/dispatch. Enforced by deploy-token-pr-guard.
      CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      HYPERDRIVE_TENANT_ID: ${{ vars.HYPERDRIVE_TENANT_ID }}
      HYPERDRIVE_CACHED_ID: ${{ vars.HYPERDRIVE_CACHED_ID }}
      HYPERDRIVE_ANCHOR_ID: ${{ vars.HYPERDRIVE_ANCHOR_ID }}
      HYPERDRIVE_RECONCILER_ID: ${{ vars.HYPERDRIVE_RECONCILER_ID }}
      HYPERDRIVE_METER_ID: ${{ vars.HYPERDRIVE_METER_ID }}
      # Free-tier event cap (S4.3 soft-cap) — optional; unset = uncapped (no Free-pause enforcement).
      FREE_EVENT_CAP: ${{ vars.FREE_EVENT_CAP }}
      # ORPHAN_SWEEP_DELETE (S6c-iii) — "true" enables the orphan-sweep delete; unset/anything else = count-only.
      ORPHAN_SWEEP_DELETE: ${{ vars.ORPHAN_SWEEP_DELETE }}
      # Billing (S4.4/S4.5) — all OPTIONAL; unset → dark (the generator strips the Hyperdrive/secret bindings
      # and empties the vars). BILLING_MODE gates the api inbound webhook + the engine meter-reporter + the
      # engine's STRIPE_SECRET_KEY / api's STRIPE_WEBHOOK_SIGNING_SECRET secret-store bindings.
      BILLING_MODE: ${{ vars.BILLING_MODE }}
      STRIPE_METER_EVENT_NAME: ${{ vars.STRIPE_METER_EVENT_NAME }}
      STRIPE_METER_ID: ${{ vars.STRIPE_METER_ID }}
      HYPERDRIVE_BILLING_ID: ${{ vars.HYPERDRIVE_BILLING_ID }}
      HYPERDRIVE_METER_AUDIT_ID: ${{ vars.HYPERDRIVE_METER_AUDIT_ID }}
      HYPERDRIVE_METER_TRANSPORT_AUDIT_ID: ${{ vars.HYPERDRIVE_METER_TRANSPORT_AUDIT_ID }}
      HYPERDRIVE_PURGE_ID: ${{ vars.HYPERDRIVE_PURGE_ID }}
      HYPERDRIVE_RETENTION_ID: ${{ vars.HYPERDRIVE_RETENTION_ID }}
      HYPERDRIVE_REAPER_ID: ${{ vars.HYPERDRIVE_REAPER_ID }}
      # Activation weekly-review endpoint (ADR-0127) — OPTIONAL; unset → the generator strips the reviewer
      # Hyperdrive + the INTERNAL_REVIEW_TOKEN secret on api, so GET /v1/internal/activation/weekly 404s (dark).
      HYPERDRIVE_ACTIVATION_REVIEWER_ID: ${{ vars.HYPERDRIVE_ACTIVATION_REVIEWER_ID }}
      HYPERDRIVE_CAPRECONCILER_ID: ${{ vars.HYPERDRIVE_CAPRECONCILER_ID }}
      HYPERDRIVE_AUTHN_ID: ${{ vars.HYPERDRIVE_AUTHN_ID }}
      HYPERDRIVE_INGEST_ID: ${{ vars.HYPERDRIVE_INGEST_ID }}
      KV_CONFIG_ID: ${{ vars.KV_CONFIG_ID }}
      KV_AUTHZ_ID: ${{ vars.KV_AUTHZ_ID }}
      OAUTH_KV_ID: ${{ vars.OAUTH_KV_ID }}
      # gen-wrangler-prod.mjs emits every app (incl. auth) each run + reqEnv()s its ids — provide auth's too,
      # even though this workflow only deploys engine/api/mcp. (deploy-auth.yml deploys auth.)
      HYPERDRIVE_AUTH_ID: ${{ vars.HYPERDRIVE_AUTH_ID }}
      HYPERDRIVE_SWEEPER_ID: ${{ vars.HYPERDRIVE_SWEEPER_ID }}
      HYPERDRIVE_NOTIFIER_ID: ${{ vars.HYPERDRIVE_NOTIFIER_ID }}
      AUTH_OAUTH_KV_ID: ${{ vars.AUTH_OAUTH_KV_ID }}
      AUTH_DEVICE_KV_ID: ${{ vars.AUTH_DEVICE_KV_ID }}
      AUTH_RATELIMIT_KV_ID: ${{ vars.AUTH_RATELIMIT_KV_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      # Blocks the auto-deploy when a migration was added since prod's schema was last brought current — i.e.
      # HEAD is ahead of the global `prod-schema` tag by a migration. NOT just this push's diff, so a later
      # no-migration push can't slip past an earlier still-unapplied migration (the S8 #300 / S3 #299 class of
      # gap). Recovery: apply the migration (scripts/apply-prod-migrations.sh advances the tag), then push; or
      # workflow_dispatch to override.
      - name: Migration guard (auto-deploy must not outrun a manual migration)
        id: migguard
        if: github.event_name == 'push'
        uses: ./.github/actions/migration-guard
      - name: Generate prod wrangler configs (overlay)
        run: node scripts/gen-wrangler-prod.mjs
      # Blocks the deploy if any RLS-scoped Hyperdrive pool has query caching enabled. Hyperdrive's cache key
      # is SQL+params and is BLIND to the RLS org GUC, and the org-wide browse reads bind no org_id — so a
      # caching tenant pool would serve one org's rows to another. Deploy-path only: it needs the prod token,
      # which is deliberately empty on a pull_request run (see deploy-token-pr-guard).
      - name: Hyperdrive cache posture (tenant pools must not cache)
        if: github.event_name != 'pull_request'
        run: node scripts/hyperdrive-cache-posture.mjs
      - name: Deploy production (engine / api / mcp)
        # main-only: a push to main, or a workflow_dispatch with main selected. Without the ref guard a
        # dispatch from a feature branch would ship unreviewed code straight to prod — keep the gate real.
        # The migration guard blocks a PUSH that changed a migration (workflow_dispatch bypasses it, since
        # the operator runs that explicitly after applying the migration).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.migguard.outputs.blocked != 'true'
        run: |
          for app in engine api mcp; do
            echo "::group::deploy $app"
            pnpm exec wrangler deploy -c "apps/$app/wrangler.prod.jsonc"
            echo "::endgroup::"
          done
      - name: Validate deploy (dry-run)
        if: github.event_name == 'pull_request'
        run: |
          for app in engine api mcp; do
            echo "::group::dry-run $app"
            pnpm exec wrangler deploy --dry-run -c "apps/$app/wrangler.prod.jsonc"
            echo "::endgroup::"
          done
