name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job name is the required status check context referenced by the ruleset: "gitleaks".
  # Complements GitHub-native secret scanning + push protection with a CI-side gate.
  #
  # We invoke the gitleaks binary directly rather than gitleaks/gitleaks-action@v2, because
  # that action requires a paid GITLEAKS_LICENSE for GitHub *organization* repos and would
  # otherwise fail this required check. The binary is Apache-2.0 and needs no license.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Install and detect are separate steps on purpose: the retry loop wraps only
      # the network install (release lookup + download + extract). `detect` runs
      # exactly once so a genuine secret finding (--exit-code 1) fails fast and is
      # never retried.
      - name: Install gitleaks
        env:
          # Authenticated api.github.com calls get 5,000 req/hr instead of the
          # unauthenticated 60 req/hr per-IP limit that was causing transient 403s
          # on shared runners.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install() {
            local version
            # Explicit `|| return 1` on every command: when a function runs as an
            # `if` condition bash suspends `set -e` inside it, so an unchecked
            # failing curl would otherwise fall through to tar on an empty file.
            version="$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
              | grep -oP '"tag_name":\s*"v\K[^"]+')" || return 1
            [ -n "$version" ] || { echo "could not resolve latest gitleaks version" >&2; return 1; }
            echo "Using gitleaks v${version}"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              -o gitleaks.tar.gz || return 1
            tar -xzf gitleaks.tar.gz gitleaks || return 1
            ./gitleaks version || return 1
          }
          for attempt in 1 2 3; do
            if install; then
              echo "gitleaks installed (attempt ${attempt})"
              exit 0
            fi
            echo "install attempt ${attempt} failed; retrying after backoff..." >&2
            sleep $(( attempt * 5 ))
          done
          echo "gitleaks install failed after 3 attempts" >&2
          exit 1

      - name: Run gitleaks detect
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1
