# Release the webhook signature registry (@webhook-co/webhooks-spec). Triggered by a
# `webhooks-spec-vX.Y.Z` tag (or a manual dispatch for testing). Builds + tests the package, proves the
# PACKAGED ARTIFACT is usable, then publishes to npm with OIDC provenance. Calls tooling directly (no
# marketplace actions — the org restricts Actions to GitHub-owned publishers, mirroring ci.yml + the
# deploy CDs). The publish is gated on a real tag push AND a configured NPM_TOKEN, so the build/test
# path is exercised on every dispatch while the first real publish stays a deliberate action.
name: release-webhooks-spec

on:
  push:
    tags: ["webhooks-spec-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (produces a dry-run unless NPM_TOKEN + a tag push)"
        required: true

permissions:
  contents: read
  id-token: write # OIDC for npm provenance

concurrency:
  group: release-webhooks-spec-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  release:
    name: release @webhook-co/webhooks-spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # User-controlled values (the dispatch input) flow through env, never `${{ }}`-interpolated into
      # the script — that would be a shell-injection vector. EVENT_NAME is a trusted GitHub context.
      - name: Resolve version from the trigger
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${REF_NAME#webhooks-spec-v}" # tag is webhooks-spec-vX.Y.Z
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::not a valid version: '$VERSION' (expected X.Y.Z, tag webhooks-spec-vX.Y.Z)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The registry is the whole product here — a wrong config row turns "unsupported" into "your
      # signature is invalid", which is worse than not shipping the provider at all.
      - name: Test the registry
        run: pnpm --filter @webhook-co/webhooks-spec test

      - name: Build (dual ESM + CJS + types)
        run: pnpm --filter @webhook-co/webhooks-spec build

      - name: Stamp the release version
        working-directory: packages/webhooks-spec
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # THE CHECK THAT MATTERS. The unit suite imports `src/`; it says nothing about the tarball. This
      # packs, installs, imports via both `import` and `require`, and makes the result verify a real
      # signature — and it asserts the packed manifest points at `dist/`, not at TypeScript source.
      #
      # That last assertion is not paranoia. This package keeps its `main`/`types`/`exports` on `src/`
      # so the five workspace packages that consume it keep resolving TypeScript; the rewrite to
      # `dist/` lives in `publishConfig`, and replacing those fields at pack time is a PNPM feature
      # that `npm publish` ignores outright. Publishing this package with npm would upload TypeScript.
      # Hence `pnpm publish` below, and hence this gate in front of it.
      - name: Smoke the PACKAGED artifact
        run: node scripts/webhooks-spec-packaged-smoke.mjs

      # Publish gate: only on a real tag PUSH and only when NPM_TOKEN is configured (inert otherwise —
      # the build + smoke above still run every time), so the first publish is a deliberate action.
      - name: Resolve the npm-publish gate
        id: npmgate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$NPM_TOKEN" ] && [ "$EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish skipped (no NPM_TOKEN, or not a tag push)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (with provenance)
        if: steps.npmgate.outputs.publish == 'true'
        working-directory: packages/webhooks-spec
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # PNPM, not npm — see the smoke-test step above. `--no-git-checks` because CI is on a
          # detached tag checkout, which pnpm otherwise refuses to publish from.
          npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          pnpm publish --no-git-checks --provenance --access public
          echo "Published @webhook-co/webhooks-spec@$VERSION to npm with provenance."
