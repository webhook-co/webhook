# CI for the Python SDK (sdks/python). It lives outside the pnpm/turbo workspace, so it needs its own
# job: format checks + the full pytest suite (which includes the generated-models drift guard). Uses only
# GitHub-owned, SHA-pinned actions (the org restricts Actions to GitHub-owned publishers). Path-filtered so
# it runs only when the Python SDK changes — which MUST include the OpenAPI spec: `_generated/models.py` is
# DERIVED from it, so a spec-only PR can stale the models. It did: the filter was `sdks/python/**` alone, so
# five spec changes never triggered this job, the drift guard never ran, and the models silently rotted for a
# week (12 missing schemas, incl. EndpointsRevealIngestUrlResponse). A derived artifact's guard must be
# triggered by its SOURCE, not only by its own directory.
name: ci-sdk-python

on:
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - "packages/openapi/src/openapi.json" # the models are generated FROM this — see the header note
      - ".github/workflows/ci-sdk-python.yml"
  pull_request:
    paths:
      - "sdks/python/**"
      - "packages/openapi/src/openapi.json" # the models are generated FROM this — see the header note
      - ".github/workflows/ci-sdk-python.yml"

permissions:
  contents: read

jobs:
  test:
    name: test (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check (black + isort)
        run: |
          black --check src tests scripts
          isort --check-only src tests scripts
      - name: Test (with coverage + the generated-models drift guard)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95
      # pytest imports from src/. That proves the CODE works and nothing about the WHEEL users install: a
      # missing package in the build config, an absent py.typed, or a module that never made it into the
      # archive all ship green. This builds the real wheel, installs it into a throwaway venv, and drives it
      # against a stub — so a broken artifact fails HERE instead of on someone's `pip install`.
      - name: Packaged-artifact smoke (build the wheel, install it, drive it)
        run: python scripts/packaged_smoke.py
