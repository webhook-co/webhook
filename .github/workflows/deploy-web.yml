name: deploy-web

# CD for the dashboard Worker (apps/web -> app.webhook.co). Unlike deploy-www.yml (a static export),
# apps/web is a dynamic OpenNext SSR Worker, so this BUILDS the worker (`opennextjs-cloudflare build`)
# before deploying. Like deploy.yml / deploy-www.yml it calls wrangler directly via pnpm (third-party
# Marketplace actions are blocked by org policy); only actions/* are used, SHA-pinned.
#
# The committed apps/web/wrangler.jsonc carries PLACEHOLDER ids (no real ids — no-secrets). The generator
# (scripts/gen-wrangler-prod.mjs) reads the resource ids from repo VARIABLES + injects account_id /
# workers_dev:false / routes (app.webhook.co custom domain) / secrets_store_secrets (CREDENTIAL_PEPPER,
# AUDIT_CHAIN_HMAC_KEY, SESSION_TOKEN_SECRET), emitting the gitignored apps/web/wrangler.prod.jsonc the
# deploy reads. Secret VALUES never enter CI — only the CF token (secret) + the non-secret ids/store id.
#
#   push to main / dispatch from main -> build, generate, then `wrangler deploy` (production)
#   pull_request                      -> build, generate, then `wrangler deploy --dry-run` (validates the
#                                        config + the worker bundle + binding resolution without deploying)
#
# NOT a required status check (lives outside ci.yml); a deploy failure never blocks a merge. The custom
# domain is bound once at the zone — a normal deploy only refreshes the Worker + its assets.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/gen-wrangler-prod.mjs"
      - ".github/workflows/deploy-web.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/gen-wrangler-prod.mjs"
      - ".github/workflows/deploy-web.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same-repo only: fork PRs don't receive secrets/vars, so a deploy/dry-run can't authenticate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Empty on the pull_request path (dry-run + gen-wrangler need no auth) so a PR run never has the
      # prod deploy token in scope; real secret only on push/dispatch. Enforced by deploy-token-pr-guard.
      CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      # The generator reqEnv()s every wedge id (engine needs them) even though web binds only
      # HYPERDRIVE_TENANT + KV_AUTHZ — provide the full set so it doesn't fail loudly.
      HYPERDRIVE_TENANT_ID: ${{ vars.HYPERDRIVE_TENANT_ID }}
      HYPERDRIVE_CACHED_ID: ${{ vars.HYPERDRIVE_CACHED_ID }}
      HYPERDRIVE_ANCHOR_ID: ${{ vars.HYPERDRIVE_ANCHOR_ID }}
      HYPERDRIVE_RECONCILER_ID: ${{ vars.HYPERDRIVE_RECONCILER_ID }}
      HYPERDRIVE_METER_ID: ${{ vars.HYPERDRIVE_METER_ID }}
      HYPERDRIVE_AUTHN_ID: ${{ vars.HYPERDRIVE_AUTHN_ID }}
      HYPERDRIVE_INGEST_ID: ${{ vars.HYPERDRIVE_INGEST_ID }}
      HYPERDRIVE_AUTH_ID: ${{ vars.HYPERDRIVE_AUTH_ID }}
      HYPERDRIVE_SWEEPER_ID: ${{ vars.HYPERDRIVE_SWEEPER_ID }}
      HYPERDRIVE_NOTIFIER_ID: ${{ vars.HYPERDRIVE_NOTIFIER_ID }}
      KV_CONFIG_ID: ${{ vars.KV_CONFIG_ID }}
      KV_AUTHZ_ID: ${{ vars.KV_AUTHZ_ID }}
      # FREE_EVENT_CAP (S4.3b) — optional Free-tier cap the usage view shows a rowless org (same GH var as
      # the engine; unset → "" → uncapped). Must equal every other worker's value.
      FREE_EVENT_CAP: ${{ vars.FREE_EVENT_CAP }}
      # Billing (S4.4b) — OPTIONAL; unset → dark (BILLING_MODE ""→ Checkout/Portal disabled; a missing or
      # malformed STRIPE_PLANS → parseStripePlans returns null → no plan picker; the generator binds
      # STRIPE_SECRET_KEY only when BILLING_MODE is on). STRIPE_PLANS is a JSON map of plan id →
      # { base, overage } price IDS — never amounts. If you rename this var, rename it HERE TOO: a var the
      # workflow does not forward reaches the generator as "" and fail-closes the dashboard silently.
      BILLING_MODE: ${{ vars.BILLING_MODE }}
      STRIPE_PLANS: ${{ vars.STRIPE_PLANS }}
      # ASYNC_ORG_DELETION (#665) — "true" routes org deletes through the async requestOrgDeletion + reaper;
      # unset/anything-else → the proven synchronous deleteOrgWithAudit (fail-safe until the reaper is live).
      ASYNC_ORG_DELETION: ${{ vars.ASYNC_ORG_DELETION }}
      # The Billing Portal configuration id (bpc_…, S6c-ii) — pins the no-refund/at-period-end contract.
      # OPTIONAL; unset → "" → the portal uses the account default.
      STRIPE_PORTAL_CONFIGURATION_ID: ${{ vars.STRIPE_PORTAL_CONFIGURATION_ID }}
      # auth.webhook.co ids — the generator emits every app each run + reqEnv()s its ids (web deploys only web).
      AUTH_OAUTH_KV_ID: ${{ vars.AUTH_OAUTH_KV_ID }}
      AUTH_DEVICE_KV_ID: ${{ vars.AUTH_DEVICE_KV_ID }}
      AUTH_RATELIMIT_KV_ID: ${{ vars.AUTH_RATELIMIT_KV_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      # apps/web reads the tenant DB, so it must not auto-deploy past an un-applied migration either. Blocks
      # when HEAD is ahead of the global prod-schema tag by a migration; recovery is applying the migration
      # (scripts/apply-prod-migrations.sh advances the tag) then pushing, or a workflow_dispatch override.
      - name: Migration guard (auto-deploy must not outrun a manual migration)
        id: migguard
        if: github.event_name == 'push'
        uses: ./.github/actions/migration-guard
      # apps/web's OpenNext build type-checks against the workspace deps' built .d.ts (the tsconfig
      # dist-redirects for the WebCrypto/KVNamespace helpers), so build their dist first.
      - name: Build workspace deps
        run: pnpm exec turbo run build --filter=@webhook-co/web^...
      - name: Build the OpenNext worker
        run: pnpm --filter @webhook-co/web build:cf
      - name: Generate prod wrangler config (overlay)
        run: node scripts/gen-wrangler-prod.mjs
      # Blocks the deploy if any RLS-scoped Hyperdrive pool has query caching enabled. Hyperdrive's cache key
      # is SQL+params and is BLIND to the RLS org GUC, and the org-wide browse reads bind no org_id — so a
      # caching tenant pool would serve one org's rows to another. Deploy-path only: it needs the prod token,
      # which is deliberately empty on a pull_request run (see deploy-token-pr-guard).
      - name: Hyperdrive cache posture (tenant pools must not cache)
        if: github.event_name != 'pull_request'
        run: node scripts/hyperdrive-cache-posture.mjs
      - name: Deploy production (app.webhook.co)
        # main-only: a push to main, or a workflow_dispatch with main selected. Without the ref guard a
        # dispatch from a feature branch would ship unreviewed code straight to prod — keep the gate real.
        # The migration guard blocks a PUSH that added a migration since prod last deployed (workflow_dispatch
        # bypasses it — the operator runs that after applying the migration).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.migguard.outputs.blocked != 'true'
        run: pnpm --filter @webhook-co/web exec wrangler deploy -c wrangler.prod.jsonc
      - name: Validate deploy (dry-run)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @webhook-co/web exec wrangler deploy --dry-run -c wrangler.prod.jsonc
