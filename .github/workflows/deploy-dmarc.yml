name: deploy-dmarc

# Deploys the DMARC aggregate-report ingestion Worker (apps/dmarc → `webhook-dmarc`).
#
# WHY THIS EXISTS: this Worker was hand-deployed from a laptop for its whole life. That was survivable
# while it was ingest-only and idle, but it now carries a cron that is a monitoring control, and a control
# nobody can redeploy reproducibly is not a control. Mirrors deploy-telemetry: the org blocks 3rd-party
# Marketplace actions, so this calls wrangler directly via pnpm; only actions/* (SHA-pinned).
#
#   push to main  -> apply D1 migrations, then deploy production
#   pull_request  -> `wrangler deploy --dry-run` (no auth, no migrations)
#
# MIGRATIONS RUN BEFORE THE DEPLOY, deliberately: the scheduled handler reads `alert_state`, so shipping
# code ahead of its table would leave the cron throwing until someone noticed. `wrangler d1 migrations
# apply` tracks what it has already run, so re-running it is a no-op.
#
# ⚠️ The cron additionally needs two SECRETS, set once out of band and NOT managed here:
#     wrangler secret put RESEND_API_KEY --name webhook-dmarc
#     wrangler secret put ALERT_TO       --name webhook-dmarc

on:
  push:
    branches: [main]
    paths:
      - "apps/dmarc/**"
      - ".github/workflows/deploy-dmarc.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/dmarc/**"
      - ".github/workflows/deploy-dmarc.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-dmarc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-dmarc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same-repo only: fork PRs don't receive secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Empty on the pull_request path (dry-run needs no auth) so a PR run never has the prod deploy token
      # in scope; real secret only on push. Enforced by deploy-token-pr-guard.
      CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply D1 migrations
        if: github.event_name == 'push'
        run: pnpm --filter @webhook-co/dmarc exec wrangler d1 migrations apply webhook-dmarc --remote
      - name: Deploy production
        if: github.event_name == 'push'
        run: pnpm --filter @webhook-co/dmarc exec wrangler deploy
      - name: Validate deploy (dry-run)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @webhook-co/dmarc exec wrangler deploy --dry-run
