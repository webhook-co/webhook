name: claude

# Lets a human drive Claude from a GitHub issue or PR by mentioning @claude — e.g. on the
# auto-filed nightly-rls failure issue: "@claude the nightly RLS suite failed again, please
# investigate and open a fix PR". Reuses the same Claude credential (CLAUDE_CODE_OAUTH_TOKEN)
# and the same pinned action + model as the AI-review workflow.
#
# Tag mode: no `prompt` is passed, so the action reads the mentioning comment/issue itself
# and responds in-thread. If no Claude credential is configured, the job no-ops with a notice
# rather than failing.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Least privilege for an assistant that may push a branch and comment back.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: claude
    # Only spin up when @claude is mentioned AND the author is trusted. This repo is
    # public and the job holds a write-capable token, so gate on author_association:
    # OWNER/MEMBER/COLLABORATOR only — never let an arbitrary external commenter drive a
    # write-capable agent (defense-in-depth on top of the action's own permission check).
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Claude credential
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude not configured::Add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in repo Settings to enable @claude mentions."
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Claude
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1
        with:
          # OAuth token (Pro/Max subscription) is preferred; the API key also works.
          # Whichever secret is unset resolves to an empty string and is ignored.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-sonnet-5"
