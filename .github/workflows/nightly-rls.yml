name: nightly-rls

# M4: run the RLS / tenant-leak suite nightly against a REAL Neon branch, not just the
# local/CI Postgres. Neon (PG 15+) can differ from local PG 14 in role/RLS behavior, so
# the freeze's isolation guarantees are re-verified on the actual managed engine.
#
# Auth: the harness auto-detects password mode from TEST_DATABASE_URL (a Neon branch URL
# has a password + sslmode=require) and mints per-run SCRAM passwords for the
# webhook_owner/app/ingest roles — no credentials in source. Point NEON_TEST_DATABASE_URL
# at a disposable Neon BRANCH (the harness creates a fresh database per test file on it).
#
# Until the Neon project + secret exist, this workflow SKIPS cleanly (no red nightly).

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-rls
  cancel-in-progress: true

jobs:
  rls-neon:
    name: rls-neon
    runs-on: ubuntu-latest
    # Surfaced to open-issue-on-failure so the issue it files names WHAT broke, not just that
    # something did. Both are empty when the suite dies before its own classifier runs.
    outputs:
      classification: ${{ steps.suite.outputs.classification }}
      signature: ${{ steps.suite.outputs.signature }}
    steps:
      - name: Check for Neon secret
        id: guard
        env:
          NEON: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          if [ -z "$NEON" ]; then
            echo "NEON_TEST_DATABASE_URL is not set — skipping. Provision a Neon branch and add" \
                 "the secret (a branch connection URL with sslmode=require) to enable the nightly" \
                 "real-engine leak suite (M4)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.guard.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.guard.outputs.enabled == 'true'
      - name: Install dbmate
        if: steps.guard.outputs.enabled == 'true'
        env:
          DBMATE_SHA256: dfd4027141b6e4357158099bdfe6c02b286af70f8e49057937744cf80b38ea1c
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      - name: RLS / tenant-leak suite vs Neon branch (retry once on TRANSIENT failure)
        id: suite
        if: steps.guard.outputs.enabled == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        # The suite is latency-sensitive against the real Neon branch (a globalSetup
        # pre-warms the compute and the remote-path timeouts are widened), but a rare
        # transient Neon blip can still fail a run. Retry the whole suite once — but ONLY
        # when the failure looks transient (a timeout / connection error). A deterministic
        # failure (e.g. an assertion or a type error) is re-run for nothing and just delays
        # the alert, so fail fast on it instead.
        run: |
          # Markers of a transient Neon/network failure worth one retry. A plain
          # AssertionError / TypeError / syntax error matches none of these -> fail fast.
          transient='CONNECT_TIMEOUT|Test timed out|Hook timed out|ECONNRESET|ECONNREFUSED|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|socket hang up|Connection terminated|terminating connection|the database system is (starting up|shutting down)|too many clients|Client has encountered a connection error|fetch failed'

          # Hand the failure job a machine-readable verdict + a bounded signature, so the issue it
          # files says WHAT broke without a human opening the run. The signature is built from a
          # FIXED set of error shapes rather than raw log lines: an allowlist can't accidentally
          # carry something unexpected out of the log and into a public issue body.
          emit() {
            {
              echo "classification=$1"
              echo 'signature<<SIGEOF'
              sed 's/\x1b\[[0-9;]*m//g' test-db.out \
                | grep -aoE "PostgresError: [^\"]{0,70}|AssertionError: [^\"]{0,70}|permission denied for table [a-z_]+|password authentication failed for user .?[a-z_]+|Test timed out in [0-9]+ms|Hook timed out in [0-9]+ms|CONNECT_TIMEOUT|FAIL +[A-Za-z0-9/._-]+\.test\.ts" \
                | sort -u | head -8
              echo 'SIGEOF'
            } >> "$GITHUB_OUTPUT"
          }

          for attempt in 1 2; do
            echo "::group::pnpm test:db (attempt ${attempt}/2)"
            set +e
            pnpm test:db 2>&1 | tee test-db.out
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              echo "::error title=nightly-rls::test:db failed after 2 attempts (exit ${status})"
              emit "transient-looking, but failed BOTH attempts"
              exit "${status}"
            fi
            if grep -qiE "${transient}" test-db.out; then
              echo "::warning title=nightly-rls::attempt ${attempt} failed (exit ${status}) with a transient-looking error; retrying once"
              sleep 15
            else
              echo "::error title=nightly-rls::attempt ${attempt} failed (exit ${status}) with a non-transient error; not retrying"
              emit "NON-TRANSIENT (a deterministic failure — not Neon latency)"
              exit "${status}"
            fi
          done

  # On a real failure (not the clean skip when the secret is unset — that leaves rls-neon
  # green), file a NEW issue — one per failing run, never a comment on a previous one.
  #
  # This used to append to a single rolling issue. That thread became a pile of unrelated
  # incidents under one title, so each new failure inherited the last one's diagnosis: the
  # 2026-07-12 outage (#512) was three deterministic bugs, but the thread's standing advice said
  # "failures are usually transient Neon latency" and it read as another slow night for days.
  # One issue per failure means each has its own signature, its own state, and closes on its own.
  #
  # The issue is left unassigned on purpose: a human comments @claude on it to investigate.
  open-issue-on-failure:
    name: open-issue-on-failure
    needs: rls-neon
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File a new issue for THIS failing run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          CLASSIFICATION: ${{ needs.rls-neon.outputs.classification }}
          SIGNATURE: ${{ needs.rls-neon.outputs.signature }}
        run: |
          set -euo pipefail
          LABEL="nightly-rls-failure"

          # Idempotent: create the label if it does not exist yet.
          gh label create "$LABEL" --repo "$REPO" --color "B60205" \
            --description "Automated: the nightly RLS/tenant-leak suite failed" \
            --force >/dev/null 2>&1 || true

          today="$(date -u +'%Y-%m-%d')"
          title="nightly-rls failed on ${today} (run ${RUN_ID})"

          # The suite dies before the retry loop on an infra fault (e.g. the setup step), in which
          # case there is no classification/signature to report. Say so rather than print nothing.
          class="${CLASSIFICATION:-unknown (the suite did not reach its own failure classifier — likely a setup/infra fault)}"
          sig="${SIGNATURE:-}"
          if [ -n "$sig" ]; then
            sig_block="$(printf '```\n%s\n```' "$sig")"
          else
            sig_block='_No recognised error signature — open the run log._'
          fi

          # Single-quoted so the markdown backticks stay literal.
          note='This suite runs the RLS / tenant-leak tests against the real Neon branch. **Do not assume it is Neon latency** — the step above already retries once on a genuinely transient error (a cold-start `CONNECT_TIMEOUT`, a `Test timed out`) and fails fast on anything deterministic, so trust the classification and read the signature. A `NON-TRANSIENT` verdict means a real bug. To have it investigated, comment `@claude` on this issue describing what to look at.'

          body="$(printf '%s\n\nRun: %s\n\n**Classification:** %s\n\n**Failure signature:**\n\n%s\n\n---\n\n%s\n\nPrior failures: [`%s` issues](%s/%s/issues?q=is%%3Aissue+label%%3A%s).\n' \
            'The `nightly-rls` workflow failed.' \
            "$RUN_URL" "$class" "$sig_block" "$note" \
            "$LABEL" "${GITHUB_SERVER_URL:-https://github.com}" "$REPO" "$LABEL")"

          url="$(gh issue create --repo "$REPO" --title "$title" --label "$LABEL" --body "$body")"
          echo "filed ${url}"
