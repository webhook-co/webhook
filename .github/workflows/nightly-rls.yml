name: nightly-rls

# M4: run the RLS / tenant-leak suite nightly against a REAL Neon branch, not just the local/CI
# Postgres. The managed engine can differ from a local cluster in role/RLS behaviour, so the
# isolation guarantees are re-verified where they actually have to hold.
#
# Auth: the harness auto-detects password mode from TEST_DATABASE_URL (a Neon branch URL has a
# password + sslmode=require) and mints a per-run SCRAM password for EVERY role in DB_ROLES (all 18,
# derived from the constant rather than hand-listed — a hand-listed subset is exactly what caused the
# 28P01 nightly in #423). No credentials in source. It creates a fresh database per test file.
#
# ⚠️ The suite refuses to run unless the repo variable NEON_TEST_DATABASE_HOST names the same host the
# secret points at (#727) — it rotates CLUSTER-GLOBAL role passwords and drops databases, so it must
# never do that to a cluster nobody named.
#
# ⚠️ THE BRANCH IS NOT DISPOSABLE. The CI Neon project has exactly ONE branch, which is `primary`,
# `default`, and has NO PARENT — so there is NO `reset_from_parent` recovery path if its
# CLUSTER-GLOBAL role state gets wedged. That matters here specifically: this harness rotates
# cluster-global role passwords on every run, and several migrations' down-sections DROP those
# roles. Treat the branch as precious, not as scratch. (Earlier wording here promised a recovery
# path that does not exist.)
#
# ⚠️ DO NOT DERIVE A "WHEN IS THE BRANCH BUSY" WINDOW FROM THE CRON. The schedule below is 07:17
# UTC, but GitHub queues scheduled runs and observed starts cluster HOURS later; single runs have
# taken ~4h. No clock-based assumption about branch availability is sound — if you need the branch,
# check for an in-flight run rather than reasoning from the cron.
#
# With NO Neon secret this workflow SKIPS cleanly (green, no red nightly). Once the secret IS set,
# NEON_TEST_DATABASE_HOST is REQUIRED and its absence FAILS the job rather than skipping — a leak
# suite that silently stops running is worse than one that goes red.

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC daily — but see the dispatch-delay warning above
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-rls
  cancel-in-progress: true

jobs:
  rls-neon:
    name: rls-neon
    runs-on: ubuntu-latest
    # A cap, not a target: the suite's own step is bounded below, and this backstops anything else
    # that hangs. Paired with open-issue-on-failure's `cancelled` gate — a job timeout CANCELS the
    # job, and `failure()` is false for cancelled, so a cap without that gate would silence the
    # alert instead of raising it. scripts/workflow-timeout-guard.mjs enforces the pairing.
    timeout-minutes: 320
    # Surfaced to open-issue-on-failure so the issue it files names WHAT broke, not just that
    # something did. Both are empty when the suite dies before its own classifier runs.
    outputs:
      classification: ${{ steps.suite.outputs.classification || steps.cap.outputs.classification }}
      signature: ${{ steps.suite.outputs.signature }}
    steps:
      - name: Check for the Neon secret and the expected-host variable
        id: guard
        env:
          NEON: ${{ secrets.NEON_TEST_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.NEON_TEST_DATABASE_HOST }}
        run: |
          if [ -z "$NEON" ]; then
            echo "NEON_TEST_DATABASE_URL is not set — skipping. Provision a Neon branch and add" \
                 "the secret (a branch connection URL with sslmode=require) to enable the nightly" \
                 "real-engine leak suite (M4)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The harness itself fails closed without this (packages/db/test/expected-host.ts), because
          # it rotates CLUSTER-GLOBAL role passwords and drops databases — operations that must never
          # land on a cluster nobody named. Checking here too turns "a cryptic refusal 40 minutes in"
          # into "a one-line explanation before anything starts".
          if [ -z "$EXPECTED_HOST" ]; then
            echo "::error title=nightly-rls::NEON_TEST_DATABASE_URL is set but the repo variable" \
                 "NEON_TEST_DATABASE_HOST is not. The suite refuses to mutate an unproven cluster." \
                 "Set the variable to the hostname of the branch the secret points at."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.guard.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.guard.outputs.enabled == 'true'
      - name: Install dbmate
        if: steps.guard.outputs.enabled == 'true'
        env:
          DBMATE_SHA256: dfd4027141b6e4357158099bdfe6c02b286af70f8e49057937744cf80b38ea1c
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate
          dbmate --version
      - name: RLS / tenant-leak suite vs Neon branch (retry once on TRANSIENT failure)
        id: suite
        if: steps.guard.outputs.enabled == 'true'
        # Bounds the suite itself, inside the job's backstop above. A STEP timeout KILLS this shell
        # mid-`pnpm test:db`, so the classifier at the bottom never runs and this step publishes an
        # EMPTY classification — the next step turns that silence into an explicit verdict. The step
        # still ends as FAILED (not cancelled), so the gate below files an issue either way.
        timeout-minutes: 300
        env:
          TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          # #727: the harness refuses to touch a cluster this does not name. Never the secret's
          # value — just the host it must equal.
          TEST_DATABASE_EXPECTED_HOST: ${{ vars.NEON_TEST_DATABASE_HOST }}
        # The suite is latency-sensitive against the real Neon branch (a globalSetup pre-warms the
        # compute and the remote-path timeouts are widened), but a rare transient Neon blip can still
        # fail a run. Retry the whole suite once — but ONLY when the failure looks transient. A
        # deterministic failure is re-run for nothing and just delays the alert.
        #
        # The verdict comes from scripts/nightly-rls-classify.mjs, NOT from shell inlined here, so it
        # can be unit-tested against real logs. It was not, and both of its defects were the kind
        # only a fixture catches: the signature was scraped from the WHOLE log (so lines printed by
        # PASSING tests were published as the failure signature — #717's issue led with two of them),
        # and there was no CONTENTION bucket, so a `28P01` caused by another consumer rotating the
        # cluster-global roles was certified as "a real bug".
        run: |
          for attempt in 1 2; do
            echo "::group::pnpm test:db (attempt ${attempt}/2)"
            set +e
            pnpm test:db 2>&1 | tee test-db.out
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            # Exit status 0 from --retryable means "a retry is advised" (a TRANSIENT first attempt).
            if node scripts/nightly-rls-classify.mjs test-db.out --attempt "${attempt}" --retryable; then
              echo "::warning title=nightly-rls::attempt ${attempt} failed (exit ${status}) with a transient-looking error; retrying once"
              sleep 15
            else
              node scripts/nightly-rls-classify.mjs test-db.out --attempt "${attempt}" --emit
              echo "::error title=nightly-rls::test:db failed on attempt ${attempt} (exit ${status})"
              exit "${status}"
            fi
          done
      # A step that was KILLED by its own cap never reached the classifier above, so the job would
      # otherwise report the generic "did not reach its own failure classifier" placeholder — which
      # reads like an infra fault and sends the reader hunting. Name it instead. `always()` is
      # required because the step above has already failed by this point.
      - name: Name a suite that was killed by its runtime cap
        id: cap
        if: ${{ always() && steps.guard.outputs.enabled == 'true' && steps.suite.outcome == 'failure' && steps.suite.outputs.classification == '' }}
        run: |
          {
            echo "classification=TIMED-OUT — the suite step hit its ${SUITE_CAP}-minute cap and was killed before it could classify its own failure. This is NOT a verdict about the code: the run may have been merely slow (durations have reached ~4h and trend upward). Check the run log for how far it got."
            echo 'signature<<SIGEOF'
            echo 'SIGEOF'
          } >> "$GITHUB_OUTPUT"
        env:
          SUITE_CAP: 300

  # On a real failure (not the clean skip when the secret is unset — that leaves rls-neon green),
  # file a NEW issue — one per failing run, never a comment on a previous one.
  #
  # This used to append to a single rolling issue. That thread became a pile of unrelated incidents
  # under one title, so each new failure inherited the last one's diagnosis: the 2026-07-12 outage
  # (#512) was three deterministic bugs, but the thread's standing advice said "failures are usually
  # transient Neon latency" and it read as another slow night for days. One issue per failure means
  # each has its own signature, its own state, and closes on its own.
  #
  # The issue is left unassigned on purpose: a human comments @claude on it to investigate.
  open-issue-on-failure:
    name: open-issue-on-failure
    needs: rls-neon
    # `failure()` alone is NOT enough once rls-neon has a timeout: a job-level timeout CANCELS the
    # job, and `failure()` is FALSE for a cancelled job — so the cap would have silenced this alert
    # rather than raising it. Both results are covered, and a cancellation is reported honestly as a
    # cancellation (it may also be a superseding run under the concurrency group, or a manual stop)
    # instead of being dressed up as a deterministic bug.
    #
    # `!cancelled()` rather than `always()`: when the WHOLE RUN is cancelled — a superseding run under
    # the concurrency group above, or a human hitting stop — `cancelled()` is true and this job skips,
    # so we do not file an issue about a run somebody deliberately stopped. A job killed by its own
    # `timeout-minutes` does NOT cancel the run, so that case still reports.
    if: ${{ !cancelled() && (needs.rls-neon.result == 'failure' || needs.rls-neon.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File a new issue for THIS failing run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.rls-neon.result }}
          CLASSIFICATION: ${{ needs.rls-neon.outputs.classification }}
          SIGNATURE: ${{ needs.rls-neon.outputs.signature }}
        run: |
          set -euo pipefail
          LABEL="nightly-rls-failure"

          # Idempotent: create the label if it does not exist yet.
          gh label create "$LABEL" --repo "$REPO" --color "B60205" \
            --description "Automated: the nightly RLS/tenant-leak suite failed" \
            --force >/dev/null 2>&1 || true

          today="$(date -u +'%Y-%m-%d')"
          title="nightly-rls failed on ${today} (run ${RUN_ID})"

          # A cancelled job never reached its own classifier, and a cancellation is not a verdict
          # about the code — say which one it was rather than inventing a bug report.
          if [ "$RESULT" = "cancelled" ]; then
            class="CANCELLED — the job was stopped before it finished (its runtime cap, a superseding run under the \`nightly-rls\` concurrency group, or a manual cancel). This is NOT evidence of a bug; check the run to see which."
          else
            class="${CLASSIFICATION:-unknown (the suite did not reach its own failure classifier — likely a setup/infra fault)}"
          fi
          sig="${SIGNATURE:-}"
          if [ -n "$sig" ]; then
            sig_block="$(printf '```\n%s\n```' "$sig")"
          else
            sig_block='_No recognised error signature — open the run log._'
          fi

          # Single-quoted so the markdown backticks stay literal.
          note='This suite runs the RLS / tenant-leak tests against the real Neon branch. **Read the classification before assuming anything** — there are four outcomes, and only one of them means a bug in the code under test:

          - `NON-TRANSIENT` — a deterministic failure. **This one is a real bug.**
          - `TRANSIENT` — a timeout/connection error; the step already retried once.
          - `CONTENTION` — something else touched the branch mid-run (roles are cluster-global and every run rotates their passwords). **Not a bug in the code under test** — re-run when the branch is idle.
          - `CANCELLED` — the job was stopped (runtime cap, superseding run, or manual cancel).

          The signature is scoped to vitest'"'"'s failing-test output, so it should name the actual failure; if it says it was scraped from the whole log, the suite died before vitest reported and the lines are not known to come from a failing test. To have this investigated, comment `@claude` on this issue describing what to look at.'

          body="$(printf '%s\n\nRun: %s\n\n**Classification:** %s\n\n**Failure signature:**\n\n%s\n\n---\n\n%s\n\nPrior failures: [`%s` issues](%s/%s/issues?q=is%%3Aissue+label%%3A%s).\n' \
            'The `nightly-rls` workflow failed.' \
            "$RUN_URL" "$class" "$sig_block" "$note" \
            "$LABEL" "${GITHUB_SERVER_URL:-https://github.com}" "$REPO" "$LABEL")"

          url="$(gh issue create --repo "$REPO" --title "$title" --label "$LABEL" --body "$body")"
          echo "filed ${url}"
